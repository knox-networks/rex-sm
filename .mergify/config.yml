queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
      - -closed
      - -conflict
      - -draft
      - -label=nomerge
      - base~=main
      - label=automerge
    merge_conditions:
      - base~=main
    commit_message_template: |
      {{ title }} (#{{ number }})

      Approved by: @{{ approved_reviews_by | join(', @') }}
      ============
      {{ body }}
    merge_method: squash

pull_request_rules:
  - name: cleanup post-merge
    conditions:
      - merged
    actions:
      label:
        remove:
          - automerge
          - nomerge
          - BLOCKED
      # The delete_head_branch action deletes the head branch of the pull request,
      # that is the branch which hosts the commits.
      # This only works if the branch is stored in the same repository that the
      # pull request target, i.e., if the pull request comes from the same repository and not from a fork.
      delete_head_branch:
       # the branch will not be deleted if another pull request depends on the head branch.
        force: false
  - name: notify on merge
    conditions:
      - merged
      - label=automerge
    actions:
      comment:
        message: "[✅] @{{author}}: **{{title}}** has been merged successfully."

  - name: alert on merge conflict
    conditions:
      - conflict
      - label=automerge
    actions:
      comment:
        message: "[🆘] @{{author}}: `{{head}}` has conflicts with `{{base}}` that must be resolved."

  - name: alert on tests failure for automerge
    conditions:
      - label=automerge
      - status-failure=commit
    actions:
      comment:
        message: "[🆘] @{{author}}: unable to merge due to CI failure."

  - name: auto-assign author
    conditions:
      - "#assignee=0"
    actions:
      assign:
        users: ["{{author}}"]
  - name: feature label
    conditions:
      - "head~=(?i)^feat(ure)?"
    actions:
      label:
        add: ["feature"]
  - name: fix label
    conditions:
      - "head~=(?i)^(bug|hot)?fix"
    actions:
      label:
        add: ["fix"]
  - name: chore label
    conditions:
      - "head~=(?i)^chore"
    actions:
      label:
        add: ["chore"]
  - name: docs label
    conditions:
      - "head~=(?i)^doc"
    actions:
      label:
        add: ["documentation"]
  - name: release
    conditions:
      - "head~=(?i)^rel(ease)?"
    actions:
      label:
        add: ["release"]
  - name: spike
    conditions:
      - "head~=(?i)^spike"
    actions:
      label:
        add: ["spike"]
  - name: rename
    conditions:
      - "head~=(?i)^rename"
    actions:
      label:
        add: ["rename"]
  - name: style
    conditions:
      - "head~=(?i)^style"
    actions:
      label:
        add: ["style"]
  - name: automerge if approved and tests pass
    conditions: []
    actions:
      queue:
